# Migrations run automatically on app start-up (app/core/migrate.py).
# To create a new one after changing models (from backend/):
#   .venv/Scripts/alembic revision --autogenerate -m "describe change"
[alembic]
script_location = migrations
# Overridden at runtime with the configured data dir; this is the default for CLI use.
sqlalchemy.url = sqlite:///../data/mission-control.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
